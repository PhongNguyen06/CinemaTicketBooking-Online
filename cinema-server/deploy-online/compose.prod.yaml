# Stage 14H: single-instance production deployment. Run from cinema-server/deploy-online.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinema_booking
      MYSQL_USER: cinema_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 35s
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cinema_booking?useUnicode=true&characterEncoding=utf8
      DB_USER: cinema_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PORT: '8080'
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal]
networks:
  internal:
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
