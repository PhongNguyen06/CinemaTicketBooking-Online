server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema_booking?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health
